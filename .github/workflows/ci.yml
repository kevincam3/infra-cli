name: ci

on:
  pull_request:
  # renovate/trusted-npm-packages is the branch of the "trusted npm packages"
  # group in renovate.json. Renovate automerges it without opening a PR, so the
  # checks have to run on the branch push itself.
  push:
    branches: [main, renovate/trusted-npm-packages]

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress. Runs on main are
# never cancelled, because they may be in the middle of a release; they queue
# behind each other instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Reads the Node version from `engines.node` in package.json.
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      # pnpm rejects or misbehaves on these local-only settings in CI.
      - name: Strip CI-incompatible pnpm-workspace settings
        run: |
          sed -i '/^loglevel:/d; /^minimumReleaseAge:/d; /^engineStrict:/d' pnpm-workspace.yaml

      # --ignore-scripts: `prepare` runs `vp config` (local git hooks only) and
      # `postinstall` scaffolds consumer config files — neither is wanted in CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The same script the local pre-merge-commit and pre-push hooks run
      # (.vite-hooks/), so CI and local merges cannot drift apart. Add new checks
      # to `verify` in package.json, not as steps here.
      #   typecheck  — lints the JS/TS files and syntax-checks every shell script
      #   shellcheck — runs the pinned koalaman/shellcheck image over bin/ and lib/
      #   test       — no `test` script exists yet; starts running once one does
      - name: Verify
        run: pnpm verify

  # Publishes with semantic-release, but only for pushes to main and only once
  # `check` has passed.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tag + version-bump commit
      packages: write # publish to GitHub Packages
      issues: write # @semantic-release/github
      pull-requests: write # @semantic-release/github

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Strip CI-incompatible pnpm-workspace settings
        run: |
          sed -i '/^loglevel:/d; /^minimumReleaseAge:/d; /^engineStrict:/d' pnpm-workspace.yaml

      # --ignore-scripts: `prepare` runs `vp config` (local git hooks only) and
      # `postinstall` scaffolds consumer config files — neither is wanted in CI.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm exec semantic-release
